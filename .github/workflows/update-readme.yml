# Dynamic README Update Workflow
# Refreshes dynamic sections of the README daily:
# - Last updated timestamp

name: Update README

on:
  schedule:
    # Runs once daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update last updated timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d")
          sed -i "s|Last updated: [0-9-]*|Last updated: $TIMESTAMP |" README.md

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update README [skip ci]"
          git push
